name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so scripts/validate.sh can diff against origin/main
          # to scope the authoring-guide checks to changed agents.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Same command as the pre-commit hook: full test suite (authoring checks
      # scoped to changed agents) + CSS staleness check.
      - name: npm run validate
        run: npm run validate

  request-copilot-review:
    name: Request Copilot authoring review
    runs-on: ubuntu-latest
    # Only on PRs that touch agent or human files — not on push to main
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changed agent files
        id: changed
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}

          COUNT=$(git diff --name-only "$BASE" "$HEAD" \
            | grep -E '^(agents/ndv-.*\.md|humans/ndv-.*\.human\.md)$' \
            | wc -l | tr -d ' ')

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Agent/human files changed: $COUNT"

      - name: Request Copilot code review
        if: steps.changed.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/requested_reviewers \
            -f "reviewers[]=copilot" \
            || echo "Copilot review request failed — enable Copilot code review in repository settings."
